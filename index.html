<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc — a small calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calc">
    <div class="calc__screen">
      <div class="calc__history" id="history"></div>
      <div class="calc__display" id="display">0</div>
    </div>

    <div class="calc__pad">
      <button class="key key--muted" data-action="clear">AC</button>
      <button class="key key--muted" data-action="negate">±</button>
      <button class="key key--muted" data-action="percent">%</button>
      <button class="key key--op" data-op="÷">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key key--op" data-op="×">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key key--op" data-op="−">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key key--op" data-op="+">+</button>

      <button class="key key--wide" data-num="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key--equals" data-action="equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
